<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Vila - Bosque Infinito</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }
        body { background-color: #061209; overflow: hidden; color: white; width: 100vw; height: 100vh; }
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; background-color: #08170c; }
        
        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6, 18, 9, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; }
        .btn-start { padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; background: #16a34a; color: white; transition: 0.2s; }
        .btn-start:hover { background: #15803d; transform: scale(1.05); }
        .btn-reset { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-reset:hover { opacity: 0.8; }
        .reset-container { margin-top: 40px; display: flex; flex-direction: column; gap: 15px; }

        /* HUD Responsiva */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        #top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; width: 100%; }
        #resource-panel { display: flex; gap: 10px; flex-wrap: wrap; pointer-events: auto; }
        .hud-box { background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 8px; font-size: 16px; font-weight: bold; border: 1px solid #16a34a; display: flex; align-items: center; gap: 6px; }
        #audio-controls { display: flex; gap: 10px; pointer-events: auto; }
        .btn-audio { background: rgba(0,0,0,0.8); border: 1px solid #1a3b22; color: #4ade80; padding: 8px 12px; border-radius: 5px; font-size: 14px; cursor: pointer; transition: 0.2s;}
        .btn-audio:hover { background: #1a3b22; }

        #bottom-bar { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; pointer-events: auto; }
        .btn-action { padding: 12px 15px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; color: white; width: 100%; transition: 0.2s; }
        .btn-action:disabled { background: #1a3b22 !important; color: #6b7280 !important; cursor: not-allowed; border: 1px solid #0f2115 !important;}
        
        #btn-toggle-build { background: #2563eb; border: 1px solid #1d4ed8; font-size: 16px; padding: 15px; max-width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #btn-toggle-build:hover { background: #1d4ed8; }

        /* Menu de Construção Agrupado */
        #build-menu { display: none; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; background: rgba(6, 18, 9, 0.95); padding: 15px; border-radius: 12px; border: 1px solid #16a34a; max-width: 800px; width: 100%; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); margin-bottom: 5px;}
        
        #btn-add-lumber { background: #16a34a; border: 1px solid #15803d; }
        #btn-add-hunter { background: #eab308; color: #451a03; border: 1px solid #a16207; }
        #btn-add-miner { background: #64748b; color: white; border: 1px solid #475569; }
        #btn-add-gold { background: #d97706; color: white; border: 1px solid #b45309; }
        #btn-add-warrior { background: #991b1b; color: white; border: 1px solid #7f1d1d; }
        #btn-add-tower { background: #475569; border: 1px solid #334155; }
        #btn-add-wall { background: #374151; border: 1px solid #1f2937; }

        #tutorial { font-size: 14px; color: #4ade80; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; pointer-events: none; margin-bottom: 5px; font-weight: bold;}
        .text-amber { color: #fbbf24; } .text-red { color: #ef4444; } .text-gray { color: #cbd5e1; } .text-gold { color: #fde047; }
        
        /* SISTEMA ROGUELIKE */
        .cards-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 20px; pointer-events: auto; max-width: 900px; max-height: 70vh; overflow-y: auto; padding-bottom: 20px;}
        .rogue-card { background: linear-gradient(145deg, #1f2937, #111827); border: 2px solid #fbbf24; border-radius: 12px; padding: 15px; width: 200px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; text-align: center;}
        .rogue-card:hover { transform: translateY(-10px) scale(1.05); box-shadow: 0 10px 25px rgba(251, 191, 36, 0.4); border-color: #fde68a; }
        .card-icon { font-size: 40px; margin-bottom: 5px; }
        .card-title { font-size: 16px; font-weight: bold; color: #fbbf24; margin-bottom: 5px; }
        .card-desc { font-size: 12px; color: #d1d5db; }
        
        #meta-stats-list { background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; border: 1px solid #4ade80; max-height: 70vh; overflow-y: auto; text-align: left; width: 300px; display: none; position: absolute; top: 60px; right: 15px; z-index: 50; pointer-events: auto;}
        .stat-item { font-size: 14px; margin-bottom: 8px; border-bottom: 1px solid #1f2937; padding-bottom: 4px; }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="start-overlay" class="overlay-screen">
        <h1 style="color: #4ade80; margin-bottom: 10px; font-size: 40px;">A Vila Infinita</h1>
        <p style="color: #9ca3af; margin-bottom: 30px;">Arraste para mover • Scroll/Pinça para Zoom</p>
        <button class="btn-start" onclick="startGame()">Jogar</button>
        
        <div class="reset-container">
            <button class="btn-reset" style="background: #eab308; color: #451a03;" onclick="resetMap()">Desistir e Resetar Mapa (Mantém Cartas)</button>
            <button class="btn-reset" style="background: #ef4444; color: white;" onclick="hardReset()">Resetar Tudo (Deleta Cartas)</button>
        </div>
    </div>

    <div id="card-selection-overlay" class="overlay-screen" style="display: none;">
        <h1 style="color: #ef4444; margin-bottom: 5px; font-size: 40px;">A Vila Caiu...</h1>
        <p style="color: #9ca3af; font-size: 18px; margin-bottom: 10px;">A guerra cobra seu preço. Escolha uma herança permanente:</p>
        <div id="cards-wrapper" class="cards-container"></div>
    </div>

    <div id="ui-layer">
        <div id="top-bar">
            <div id="resource-panel">
                <div class="hud-box">🛖 <span id="global-wood" class="text-amber">0</span> 🪵</div>
                <div class="hud-box">🏕️ <span id="global-food" class="text-red">0</span> 🍖</div>
                <div class="hud-box">⛺ <span id="global-stone" class="text-gray">0</span> 🪨</div>
                <div class="hud-box">🎪 <span id="global-gold" class="text-gold">0</span> 🪙</div>
            </div>
            <div id="audio-controls">
                <button class="btn-audio" onclick="toggleMetaStats()">🃏 Bônus</button>
                <button id="btn-music" class="btn-audio" onclick="toggleMusic()">🎵 ON</button>
                <button id="btn-sfx" class="btn-audio" onclick="toggleSfx()">🔊 ON</button>
            </div>
        </div>
        
        <div id="meta-stats-list"></div>

        <div id="bottom-bar">
            <div id="tutorial">🛡️ Aliados detectam Inimigos globalmente! Quartéis defendem a base.</div>
            
            <div id="build-menu">
                <button id="btn-add-lumber" class="btn-action" onclick="buyCamp('wood')">➕ Lenhador</button>
                <button id="btn-add-hunter" class="btn-action" onclick="buyCamp('food')">➕ Caçador</button>
                <button id="btn-add-miner" class="btn-action" onclick="buyCamp('stone')">➕ Minerador</button>
                <button id="btn-add-gold" class="btn-action" onclick="buyCamp('gold')">➕ Minerador de Ouro</button>
                <button id="btn-add-warrior" class="btn-action" onclick="buyCamp('barracks')">⚔️ Quartel (Guerreiro)</button>
                <button id="btn-add-tower" class="btn-action" onclick="buyCamp('tower')">🗼 Torre</button>
                <button id="btn-add-wall" class="btn-action" onclick="buyWall()">🧱 Muro de Pedra</button>
            </div>
            
            <button id="btn-toggle-build" class="btn-action" onclick="toggleBuildMenu()">🔨 Abrir Construções</button>
        </div>
    </div>

    <script>
        function toggleBuildMenu() {
            let menu = document.getElementById('build-menu'); let btn = document.getElementById('btn-toggle-build');
            if(menu.style.display === 'grid') { menu.style.display = 'none'; btn.innerText = '🔨 Abrir Construções'; } 
            else { menu.style.display = 'grid'; btn.innerText = '❌ Fechar Menu'; } sfx('pickup');
        }

        /* --- 60 CARTAS ROGUELIKE --- */
        const META_CARDS = [

            { id: "act_f", i: "🦅", n: "Olhos de Águia", d: "Mira do arco 15% mais rápida." },
            { id: "atk_w", i: "🏹", n: "Arco Longo", d: "Arqueiros/Torres atiram 10% longe." },
            { id: "arr_spd", i: "💨", n: "Flechas Aero", d: "Flechas voam 20% mais rápido." },
            { id: "def_wlf", i: "🛡️", n: "Armadura Leve", d: "+5% chance de sobreviver Lobos." },
            { id: "def_br", i: "🏰", n: "Lanças Defesa", d: "+2% chance de sobreviver Ursos." },
            { id: "str_w", i: "🪵", n: "Estoque (Mad)", d: "Comece com +50 Madeira." },
            { id: "str_f", i: "🍖", n: "Estoque (Com)", d: "Comece com +50 Comida." },
            { id: "str_s", i: "🪨", n: "Estoque (Ped)", d: "Comece com +25 Pedra." },
            { id: "yld_w", i: "🌲", n: "Árvores Gigantes", d: "Árvores caem com -1 golpe." },
            { id: "yld_s", i: "💎", n: "Veio Rico", d: "Pegue pedra a cada 4 acertos (era 5)." },
            { id: "drp_wlf", i: "🐺", n: "Lobo Gordo", d: "+10% lobo dropar carne." },
            { id: "drp_br", i: "🐻", n: "Urso Colossal", d: "+15% urso dropar 2 carnes." },
            { id: "spn_hr", i: "🐇", n: "Lebres Férteis", d: "Lebres nascem 10% mais rápido." },
            { id: "spn_wlf", i: "🌿", n: "Ervas Ocultas", d: "Lobos aparecem 10% menos vezes." },
            { id: "spd_br", i: "🍯", n: "Mel Pegajoso", d: "Ursos andam 5% mais devagar." },
            { id: "dbl_w", i: "🍀", n: "Sorte Lenhador", d: "5% chance de dobrar mad. depositada." },
            { id: "dbl_f", i: "🍖", n: "Sorte Caçador", d: "5% chance de dobrar carne depositada." },
            { id: "dbl_s", i: "✨", n: "Sorte Minerador", d: "5% chance de dobrar pedra depositada." },
            { id: "free_c", i: "⛺", n: "Pioneiros", d: "Comece com 1 Caçador grátis." },
            { id: "spd_g", i: "🏃‍♂️", n: "Febre do Ouro", d: "Mineradores de Ouro andam +10% rápido." },

            { id: "act_g", i: "⛏️", n: "Picareta Ouro", d: "Mineração de ouro 15% mais rápida." },
            { id: "dbl_g", i: "🌟", n: "Sorte Dourada", d: "5% chance de dobrar ouro depositado." },
            { id: "str_g", i: "🪙", n: "Herança Dourada", d: "Comece com +10 Ouro." },
            { id: "yld_g", i: "🗻", n: "Montanha Pura", d: "Pegue ouro com -1 acerto." },
            { id: "war_spd", i: "🪖", n: "Guerreiros Ágeis", d: "Guerreiros de Clava andam +10% rápido." },
            { id: "war_atk", i: "🏏", n: "Clavas Pesadas", d: "+5% de chance dos Guerreiros matarem." },
            { id: "war_def", i: "🛡️", n: "Escudo Pessoal", d: "Guerreiros têm +5% chance de não morrer." },
            { id: "war_cst", i: "📜", n: "Alistamento", d: "Quartéis custam -10% de Ouro." },
            { id: "war_v_w", i: "🐺", n: "Caça-Lobos", d: "Guerreiros matam Lobos com 100% chance." },
            { id: "tw_dmg", i: "🔥", n: "Flecha de Fogo", d: "Torres têm +5% chance de acerto letal." },
            { id: "tw_spd", i: "⚙️", n: "Torres Rápidas", d: "Torres atiram 15% mais rápido." },
            { id: "wl_hp", i: "🧱", n: "Muralha Dura", d: "Muros ganham +200 HP." },
            { id: "cp_hp", i: "🏯", n: "Casas Fortes", d: "Todas as tendas/casas ganham +500 HP." },
            { id: "cp_rep", i: "🛠️", n: "Auto-Reparo", d: "Casas e muros regeneram +2 HP por segundo." },
            { id: "hnt_war", i: "🎯", n: "Caçador Milícia", d: "Caçadores têm +5% chance de matar Guerreiro Inimigo." },
            { id: "drp_lio", i: "🦁", n: "Leão Valioso", d: "Leões têm 10% chance de dropar Ouro." },
            { id: "emy_slw", i: "⛓️", n: "Caminho Turvo", d: "Guerreiros Inimigos andam 5% mais devagar." },
            { id: "emy_atd", i: "🛡️", n: "Invasores Fracos", d: "Guerreiros Inimigos têm -5% chance de dano." },
            { id: "emy_drp", i: "💎", n: "Espólios", d: "Inimigos mortos têm 15% chance de dropar Ouro." },
            { id: "raid_dl", i: "⏳", n: "Batedores", d: "Invasões demoram +10% de tempo para acontecer." },
            { id: "glbl_mv", i: "💨", n: "Vento à Favor", d: "TODOS os trabalhadores andam +5% rápido." },
            { id: "glbl_cr", i: "🏋️", n: "Costas Fortes", d: "TODOS carregam +1 recurso." },
            { id: "pas_w", i: "🌱", n: "Raízes", d: "Ganha 1 Madeira passiva a cada 10 seg." },
            { id: "pas_f", i: "🍄", n: "Coleta Passiva", d: "Ganha 1 Comida passiva a cada 10 seg." },
            { id: "pas_s", i: "⛰️", n: "Erosão", d: "Ganha 1 Pedra passiva a cada 20 seg." },
            { id: "pas_g", i: "✨", n: "Pó de Ouro", d: "Ganha 1 Ouro passivo a cada 30 seg." },
            { id: "free_w", i: "⚔️", n: "Guarda-Costas", d: "Comece o jogo com 1 Quartel grátis." },
            { id: "hare_f", i: "🐇", n: "Caça Abundante", d: "Lebres agora valem 2 carnes ao serem caçadas." }
        ];

        let metaStats = {};
        function loadMeta() { const m = localStorage.getItem('bosqueMeta'); if(m) metaStats = JSON.parse(m); else metaStats = {}; }
        function saveMeta() { localStorage.setItem('bosqueMeta', JSON.stringify(metaStats)); }
        function getMeta(id) { return metaStats[id] || 0; }
        function toggleMetaStats() {
            let p = document.getElementById('meta-stats-list'); if (p.style.display === 'block') { p.style.display = 'none'; return; }
            p.style.display = 'block'; p.innerHTML = '<h3 style="color:#4ade80; margin-bottom:10px;">Suas Cartas</h3>';
            let keys = Object.keys(metaStats); if(keys.length === 0) p.innerHTML += "<p>Nenhuma carta ganha ainda.</p>";
            keys.forEach(k => { let card = META_CARDS.find(c => c.id === k); if(card) p.innerHTML += `<div class="stat-item">${card.i} <b>${card.n} (x${metaStats[k]})</b></div>`; });
        }

        function resetMap() { if(confirm("Abandonar este mapa? Você manterá suas cartas para a próxima partida.")) { localStorage.removeItem('bosqueSave'); location.reload(); } }
        function hardReset() { if(confirm("ATENÇÃO: Deletar TODO o progresso, INCLUINDO AS CARTAS?")) { if(confirm("ÚLTIMO AVISO: Isso é permanente.")) { localStorage.removeItem('bosqueSave'); localStorage.removeItem('bosqueMeta'); location.reload(); } } }
        
        function triggerRoguelikeDeath() {
            isGameOver = true; sfx('human_die'); localStorage.removeItem('bosqueSave');
            document.getElementById('card-selection-overlay').style.display = 'flex';
            let shuffled = [...META_CARDS].sort(() => 0.5 - Math.random()); let choices = shuffled.slice(0, 3);
            let wrapper = document.getElementById('cards-wrapper'); wrapper.innerHTML = '';
            choices.forEach(card => {
                let cardEl = document.createElement('div'); cardEl.className = 'rogue-card';
                cardEl.innerHTML = `<div class="card-icon">${card.i}</div><div class="card-title">${card.n}</div><div class="card-desc">${card.d}</div><div style="margin-top: 15px; font-size: 14px; font-weight: bold; color: #4ade80;">Nível Atual: ${getMeta(card.id)}</div>`;
                cardEl.onclick = () => selectCard(card.id); wrapper.appendChild(cardEl);
            });
        }
        function selectCard(id) { sfx('card'); metaStats[id] = (metaStats[id] || 0) + 1; saveMeta(); setTimeout(() => { location.reload(); }, 150); }

        /* --- ENGINE GRÁFICA --- */
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const spriteCache = {};
        function getSprite(char, size) {
            let key = char + "_" + size;
            if (!spriteCache[key]) {
                let c = document.createElement('canvas'); let pad = size * 2; c.width = pad; c.height = pad;
                let cCtx = c.getContext('2d'); cCtx.font = size + "px Arial"; cCtx.textAlign = "center"; cCtx.textBaseline = "middle";
                cCtx.fillText(char, c.width/2, c.height/2 + size*0.05); spriteCache[key] = { img: c, cx: c.width/2, cy: c.height/2 };
            } return spriteCache[key];
        }
        function drawEmoji(char, size, x, y) { let s = getSprite(char, size); ctx.drawImage(s.img, x - s.cx, y - s.cy); }
        function drawEmojiRotated(char, size, x, y, angle) { let s = getSprite(char, size); ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.drawImage(s.img, -s.cx, -s.cy); ctx.restore(); }

        let camera = { x: 0, y: 0, zoom: 1 };
        let isDragging = false, dragStartX = 0, dragStartY = 0, camStartX = 0, camStartY = 0, isPinching = false, initialPinchDist = 0, initialZoom = 1;
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resizeCanvas); resizeCanvas();
        canvas.addEventListener('mousedown', e => { isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY; camStartX = camera.x; camStartY = camera.y; });
        window.addEventListener('mousemove', e => { if (isDragging) { camera.x = camStartX - (e.clientX - dragStartX) / camera.zoom; camera.y = camStartY - (e.clientY - dragStartY) / camera.zoom; } });
        window.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('wheel', e => { camera.zoom *= e.deltaY > 0 ? 0.9 : 1.1; camera.zoom = Math.max(0.3, Math.min(camera.zoom, 3)); });
        canvas.addEventListener('touchstart', e => { if (e.touches.length === 1) { isDragging = true; dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY; camStartX = camera.x; camStartY = camera.y; } else if (e.touches.length === 2) { isPinching = true; isDragging = false; initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); initialZoom = camera.zoom; } });
        window.addEventListener('touchmove', e => { if (isDragging && e.touches.length === 1) { camera.x = camStartX - (e.touches[0].clientX - dragStartX) / camera.zoom; camera.y = camStartY - (e.touches[0].clientY - dragStartY) / camera.zoom; } else if (isPinching && e.touches.length === 2) { let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); camera.zoom = initialZoom * (dist / initialPinchDist); camera.zoom = Math.max(0.3, Math.min(camera.zoom, 3)); } });
        window.addEventListener('touchend', () => { isDragging = false; isPinching = false; });
        function screenToWorld(sx, sy) { return { x: (sx - canvas.width / 2) / camera.zoom + camera.x, y: (sy - canvas.height / 2) / camera.zoom + camera.y }; }

        /* --- SISTEMA DE ÁUDIO --- */
        let audioCtx, musicGain, sfxGain, masterCompressor;
        let isMusicOn = localStorage.getItem('bosqueMusic') !== 'false'; let isSfxOn = localStorage.getItem('bosqueSfx') !== 'false'; let lastSoundTime = {}; 
        function initAudio() {
            updateAudioUI(); if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext; audioCtx = new AudioContext();
            masterCompressor = audioCtx.createDynamicsCompressor(); masterCompressor.threshold.setValueAtTime(-15, audioCtx.currentTime); masterCompressor.connect(audioCtx.destination);
            musicGain = audioCtx.createGain(); musicGain.gain.value = isMusicOn ? 0.1 : 0; musicGain.connect(masterCompressor); sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.3; sfxGain.connect(masterCompressor);

        /* --- CONSTRUÇÃO DO MURO --- */
        function carveGateInWall(segments, wallObj) {
            let finalSegs = [...segments];
            if (towersList.length > 0) {
                towersList.forEach(tower => {
                    let closestSeg = null; let minD = Infinity;
                    finalSegs.forEach(s => { let d = Math.hypot(s.x - tower.x, s.y - tower.y); if (d < minD) { minD = d; closestSeg = s; } });
                    if (closestSeg) {

                        let dl = Math.abs(closestSeg.x - wallObj.minX), dr = Math.abs(closestSeg.x - wallObj.maxX);
                        let dt = Math.abs(closestSeg.y - wallObj.minY), db = Math.abs(closestSeg.y - wallObj.maxY);
                        let m = Math.min(dl, dr, dt, db);
                        if (m === dl) wallObj.gateSide = 'left'; else if (m === dr) wallObj.gateSide = 'right'; else if (m === dt) wallObj.gateSide = 'top'; else wallObj.gateSide = 'bottom';
                        finalSegs = finalSegs.filter(s => Math.hypot(s.x - closestSeg.x, s.y - closestSeg.y) >= 120);
                    }
                });
            }
            finalSegs = finalSegs.filter(s => { for(let c of camps) { if (c.type !== 'tower') { if (Math.hypot(s.x - c.x, s.y - c.y) < 60) return false; } } return true; });
            return finalSegs;
        }

        function calculateNextWall() {
            if (towersList.length === 0) return { possible: false, reason: "Requer Torre" }; if (camps.length === 0) return { possible: false, reason: "Sem casas" };
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            camps.forEach(c => { if (c.x < minX) minX = c.x; if (c.x > maxX) maxX = c.x; if (c.y < minY) minY = c.y; if (c.y > maxY) maxY = c.y; });
            if (minX === maxX) { minX -= GRID_SIZE; maxX += GRID_SIZE; } if (minY === maxY) { minY -= GRID_SIZE; maxY += GRID_SIZE; } minX -= 60; maxX += 60; minY -= 60; maxY += 60;
            if (walls.length > 0) { let last = walls[walls.length - 1]; if (minX > last.minX - 70) minX = last.minX - 70; if (maxX < last.maxX + 70) maxX = last.maxX + 70; if (minY > last.minY - 70) minY = last.minY - 70; if (maxY < last.maxY + 70) maxY = last.maxY + 70; }
            let segments = []; let step = 30; let maxHp = 300 + (getMeta('wl_hp')*200);
            for (let x = minX; x <= maxX; x += step) { segments.push({x: x, y: minY, hp: maxHp, maxHp}); segments.push({x: x, y: maxY, hp: maxHp, maxHp}); }
            for (let y = minY; y <= maxY; y += step) { segments.push({x: minX, y: y, hp: maxHp, maxHp}); segments.push({x: maxX, y: y, hp: maxHp, maxHp}); }
            let uniqueSegs = []; let seen = new Set(); segments.forEach(s => { let key = `${Math.round(s.x)},${Math.round(s.y)}`; if(!seen.has(key)) { seen.add(key); uniqueSegs.push(s); } });
            let tempWall = { minX, maxX, minY, maxY }; let finalSegs = carveGateInWall(uniqueSegs, tempWall); let cost = Math.floor(finalSegs.length * 1.5);
            return { possible: true, cost: cost, minX, maxX, minY, maxY, segments: finalSegs, gateX: tempWall.gateX, gateY: tempWall.gateY, gateSide: tempWall.gateSide };
        }

            if (spend(0, 0, next.cost)) { walls.push({ minX: next.minX, maxX: next.maxX, minY: next.minY, maxY: next.maxY, segments: next.segments, gateX: next.gateX, gateY: next.gateY, gateSide: next.gateSide }); sfx('upg'); updateUI(); saveGame(); } else sfx('error');

        /* --- SISTEMA DE PATHFINDING E COLISÕES --- */
        function isPointInWall(x, y) { if (walls.length === 0) return false; let pad = 35; for (let w of walls) { for (let s of w.segments) { let dx = x - s.x, dy = y - s.y; if (dx*dx + dy*dy < pad*pad) return true; } } return false; }
        function getValidSpawnPoint(baseX, baseY, range) { let tx, ty, attempts = 0; do { tx = baseX + (Math.random() - 0.5) * range; ty = baseY + (Math.random() - 0.5) * range; attempts++; } while (isPointInWall(tx, ty) && attempts < 25); return { x: tx, y: ty, valid: !isPointInWall(tx, ty) }; }
        function getValidRadialSpawn(baseX, baseY, radius) { let tx, ty, attempts = 0; do { let a = Math.random() * Math.PI * 2; tx = baseX + Math.cos(a) * radius; ty = baseY + Math.sin(a) * radius; attempts++; } while (isPointInWall(tx, ty) && attempts < 25); return { x: tx, y: ty, valid: !isPointInWall(tx, ty) }; }
        function lineIntersectsWall(x1, y1, x2, y2, w) { let pad = 20; let iL = w.minX - pad, iR = w.maxX + pad, iT = w.minY - pad, iB = w.maxY + pad; if (Math.max(x1, x2) < iL || Math.min(x1, x2) > iR || Math.max(y1, y2) < iT || Math.min(y1, y2) > iB) return false; let steps = 15; for(let i=1; i<=steps; i++) { let px = x1 + (x2-x1)*(i/steps); let py = y1 + (y2-y1)*(i/steps); if (px > iL && px < iR && py > iT && py < iB) return true; } return false; }
        function getPathAroundRect(x1, y1, x2, y2, w) {
            if (!lineIntersectsWall(x1, y1, x2, y2, w)) return [{x: x2, y: y2}];
            let pad = 40; let L = w.minX - pad, R = w.maxX + pad, T = w.minY - pad, B = w.maxY + pad;
            let nodes = [ {x: x1, y: y1}, {x: x2, y: y2}, {x: L, y: T}, {x: R, y: T}, {x: R, y: B}, {x: L, y: B} ]; let graph = Array(6).fill(0).map(()=>[]);
            for(let i=0; i<6; i++) { for(let j=i+1; j<6; j++) { if (!lineIntersectsWall(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y, w)) { let d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y); graph[i].push({n: j, w: d}); graph[j].push({n: i, w: d}); } } }
            let dist = Array(6).fill(Infinity); let prev = Array(6).fill(-1); dist[0] = 0; let q = [0,1,2,3,4,5];
            while(q.length > 0) { q.sort((a,b) => dist[a] - dist[b]); let u = q.shift(); if (u === 1 || dist[u] === Infinity) break; for(let edge of graph[u]) { let alt = dist[u] + edge.w; if (alt < dist[edge.n]) { dist[edge.n] = alt; prev[edge.n] = u; } } }

            let exitWalls = sWalls.filter(w => !dWalls.includes(w)); let enterWalls = dWalls.filter(w => !sWalls.includes(w)).reverse(); 
            let path = []; let cx = startX, cy = startY;
            for (let w of exitWalls) {
                if (w.gateX === undefined) continue; let pull = 110; let inNode = {x: w.gateX, y: w.gateY}; let outNode = {x: w.gateX, y: w.gateY};
                if (w.gateSide === 'left') { outNode.x -= pull; inNode.x += pull; } else if (w.gateSide === 'right') { outNode.x += pull; inNode.x -= pull; } else if (w.gateSide === 'top') { outNode.y -= pull; inNode.y += pull; } else { outNode.y += pull; inNode.y -= pull; }

                if (w.gateX === undefined) continue; let pull = 110; let inNode = {x: w.gateX, y: w.gateY}; let outNode = {x: w.gateX, y: w.gateY};
                if (w.gateSide === 'left') { outNode.x -= pull; inNode.x += pull; } else if (w.gateSide === 'right') { outNode.x += pull; inNode.x -= pull; } else if (w.gateSide === 'top') { outNode.y -= pull; inNode.y += pull; } else { outNode.y += pull; inNode.y -= pull; }

        function walkPath(ent) {

                let hit2 = collideBox(ent, w.maxX - pad, w.maxX + pad, w.minY - pad, w.maxY + pad); 
                let hit3 = collideBox(ent, w.minX - pad, w.maxX + pad, w.minY - pad, w.minY + pad);

            if(distSq < radius * radius) { let dist = Math.sqrt(distSq), overlap = radius - dist; let pushX = (dx / dist) * (overlap * force), pushY = (dy / dist) * (overlap * force); a.x += pushX * 0.5; a.y += pushY * 0.5; b.x -= pushX * 0.5; b.y -= pushY * 0.5; }

                // Se não tem humano, procura bicho num raio de 500
                let tEnemy = getClosestEnemy(w.x, w.y);
                if (tEnemy && Math.hypot(w.x-tEnemy.x, w.y-tEnemy.y) < 500) tgt = tEnemy; 
            }

            if (tgt) { w.state = 'hunting'; w.targetObj = tgt; } 
            else if (w.state === 'hunting' || w.state === 'melee_attack') { w.state = 'patrol'; w.path = []; w.targetObj = null; }

            if (w.state === 'patrol' || w.state === 'idle') {
                w.state = 'patrol';
                if (w.path.length === 0) {
                    if (Math.random() < 0.02) {
                        let rx = camp.x + (Math.random() - 0.5) * 200; let ry = camp.y + (Math.random() - 0.5) * 200;
                        if (!isPointInWall(rx, ry)) w.path = calculatePath(w.x, w.y, rx, ry);
                    }
                } else walkPath(w);
            }
            else if (w.state === 'hunting') {
                if (!w.targetObj || !w.targetObj.active) { w.state = 'patrol'; w.path=[]; return; }
                if (w.path.length === 0 || (w.path.length === 1 && Math.hypot(w.path[0].x - w.targetObj.x, w.path[0].y - w.targetObj.y) > 50)) { w.path = calculatePath(w.x, w.y, w.targetObj.x, w.targetObj.y); }
                if (w.path.length > 1) { walkPath(w); } else if (Math.hypot(w.targetObj.x - w.x, w.targetObj.y - w.y) > 25) { walkPath(w); } 
                else { w.state = 'melee_attack'; w.timer = 0; w.path = []; }
            }
            else if (w.state === 'melee_attack') {
                if (!w.targetObj || !w.targetObj.active) { w.state = 'patrol'; return; }
                if (Math.hypot(w.targetObj.x - w.x, w.targetObj.y - w.y) > 30) { w.state = 'hunting'; return; } 
                
                w.timer++; if(w.timer > 15) w.showAct = true; else w.showAct = false;
                if (w.timer >= 30) {
                    w.timer = 0; sfx('chop'); w.showAct = false;
                    let killChance = 0.5 + (getMeta('war_atk')*0.05);
                    if (w.targetObj.type === 'wolf' && getMeta('war_v_w') > 0) killChance = 1.0;
                    if (Math.random() <= killChance) { 
                        w.targetObj.active = false; 
                        if (w.targetObj.type === 'enemyWarrior') { sfx('human_die'); if (Math.random() <= getMeta('emy_drp')*0.15) drops.push({x:w.targetObj.x, y:w.targetObj.y, active:true, isGoldDrop:true}); }
                        else if (w.targetObj.type === 'bear' || w.targetObj.type === 'lion') sfx('bear_roar');
                        else sfx('wolf_die');
                        w.state = 'patrol'; w.targetObj = null;
                    }
                }
            }
        }

        // Trabalhadores de Recurso
        function processWorker(camp) {
            let w = camp.worker; if (w.isDead) return;
            
            if (!w.lastX) { w.lastX = w.x; w.lastY = w.y; w.stuckTimer = 0; }
            if (w.state === 'moving' || w.state === 'returning' || w.state === 'hunting') {
                if (Math.hypot(w.x - w.lastX, w.y - w.lastY) < 0.5) w.stuckTimer++; else w.stuckTimer = 0;
                w.lastX = w.x; w.lastY = w.y;
                if (w.stuckTimer > 90) { w.stuckTimer = 0; w.path = []; if (w.state === 'returning') { w.x = camp.x; w.y = camp.y; } else if (w.targetObj) { w.x = w.targetObj.x; w.y = w.targetObj.y; } }
            } else { w.stuckTimer = 0; }

            let totC = w.carry + w.carryFood; let tEnemy = getClosestEnemy(w.x, w.y); let hasHunt = camp.type === 'food' && tEnemy;

            if (w.state === 'idle_full' && hasHunt) w.state = 'idle';
            if (!hasHunt && camp.stored >= camp.capacity && totC > 0 && w.state !== 'returning') { w.state = 'idle_full'; return; }
            if (w.state === 'idle_full' && camp.stored < camp.capacity) w.state = 'returning';

            if (w.state === 'idle') {
                if (totC >= w.maxCarry && !hasHunt) { w.state = 'returning'; w.path = calculatePath(w.x, w.y, camp.x, camp.y); } 
                else {
                    let tgt = null;
                    if (camp.type === 'wood') { let cM = getClosestActive(w.x, w.y, trees); let cD = getClosestActive(w.x, w.y, drops); if (cD && cM) { tgt = Math.hypot(cD.x-w.x,cD.y-w.y) < Math.hypot(cM.x-w.x,cM.y-w.y) ? cD : cM; } else tgt = cD || cM; } 
                    else if (camp.type === 'stone') { let cM = getClosestActive(w.x, w.y, mountains); let cD = getClosestActive(w.x, w.y, drops); if (cD && cM) { tgt = Math.hypot(cD.x-w.x,cD.y-w.y) < Math.hypot(cM.x-w.x,cM.y-w.y) ? cD : cM; } else tgt = cD || cM; } 
                    else if (camp.type === 'gold') { let cM = getClosestActive(w.x, w.y, goldMountains); let cD = getClosestActive(w.x, w.y, drops); if (cD && cM) { tgt = Math.hypot(cD.x-w.x,cD.y-w.y) < Math.hypot(cM.x-w.x,cM.y-w.y) ? cD : cM; } else tgt = cD || cM; }
                    else { tgt = tEnemy; if (!tgt && totC < w.maxCarry) { tgt = getClosestActive(w.x, w.y, drops); if(!tgt) tgt = getClosestActive(w.x, w.y, hares); } }
                    
                    if (tgt) { if (tgt.isDrop || camp.type!=='food') w.state = 'moving'; else w.state = 'hunting'; w.targetObj = tgt; w.path = calculatePath(w.x, w.y, tgt.x, tgt.y); } 
                    else if (totC > 0) { w.state = 'returning'; w.path = calculatePath(w.x, w.y, camp.x, camp.y); }
                    else { if (Math.random() < 0.02) { w.x += (Math.random() - 0.5) * 15; w.y += (Math.random() - 0.5) * 15; if (Math.hypot(w.x - camp.x, w.y - camp.y) > 40) { w.x = camp.x; w.y = camp.y; } } }
                }
            }
            
            else if (w.state === 'moving' && w.targetObj) {
                if(!w.targetObj.active) { w.state='idle'; return; }
                if (w.path.length === 0 || (w.path.length === 1 && Math.hypot(w.path[0].x - w.targetObj.x, w.path[0].y - w.targetObj.y) > 50)) { w.path = calculatePath(w.x, w.y, w.targetObj.x, w.targetObj.y); }
                walkPath(w);
                if (w.path.length === 0 || (w.path.length === 1 && Math.hypot(w.targetObj.x - w.x, w.targetObj.y - w.y) <= (w.targetObj.isDrop?10:25))) {
                    w.state = w.targetObj.isDrop ? 'looting' : 'chopping'; w.timer = 0; w.path = [];
                }
            }

            else if (w.state === 'chopping') {
                if (!w.targetObj.active) { w.state = 'idle'; return; } w.timer++;
                let tMax = (camp.type==='stone'||camp.type==='gold') ? Math.max(10, 40 * Math.pow(0.85, getMeta('act_s'))) : Math.max(10, 30 * Math.pow(0.85, getMeta('act_w')));
                if (camp.type==='gold') tMax *= Math.pow(0.85, getMeta('act_g'));
                if (w.timer >= tMax) {
                    w.timer = 0; w.targetObj.hits--; w.showAct = true; setTimeout(() => w.showAct = false, 150); sfx((camp.type==='stone'||camp.type==='gold') ? 'mine' : 'chop');
                    if (camp.type==='stone' || camp.type==='gold') {
                        let req = Math.max(1, (camp.type==='gold'?5-getMeta('yld_g'):5-getMeta('yld_s')));
                        if (w.targetObj.hits % req === 0) { w.carry++; sfx('pickup'); }
                        if (w.carry + w.carryFood >= w.maxCarry) { w.state = 'returning'; w.path = calculatePath(w.x, w.y, camp.x, camp.y); }
                        if (w.targetObj.hits <= 0) { w.targetObj.active = false; w.targetObj.timer = camp.type==='gold'?1200:600; w.state = 'idle'; }
                    } else { if (w.targetObj.hits <= 0) { w.targetObj.active = false; w.targetObj.timer = 300; w.carry++; sfx('fall'); w.state = 'idle'; } }
                }
            }

            else if (w.state === 'hunting') {
                if (!w.targetObj.active) { w.state = 'idle'; return; }
                if (w.path.length === 0 || (w.path.length === 1 && Math.hypot(w.path[0].x - w.targetObj.x, w.path[0].y - w.targetObj.y) > 50)) { w.path = calculatePath(w.x, w.y, w.targetObj.x, w.targetObj.y); }
                let isPred = w.targetObj.type === 'wolf' || w.targetObj.type === 'bear' || w.targetObj.type === 'lion' || w.targetObj.type === 'enemyWarrior';
                let atkRange = (isPred?150:80) * (1 + getMeta('atk_w')*0.1);
                if (w.path.length > 1) { walkPath(w); } else if (Math.hypot(w.targetObj.x - w.x, w.targetObj.y - w.y) > atkRange) { walkPath(w); } else { w.state = 'aiming'; w.timer = 0; w.path = []; }
            }

            else if (w.state === 'aiming') {
                if (!w.targetObj.active) { w.state = 'idle'; return; }
                w.bowAngle = Math.atan2(w.targetObj.y - w.y, w.targetObj.x - w.x); w.timer++;
                let isPred = w.targetObj.type === 'wolf' || w.targetObj.type === 'bear' || w.targetObj.type === 'lion' || w.targetObj.type === 'enemyWarrior';
                let aimMax = (isPred?20:40) * Math.pow(0.85, getMeta('act_f'));
                if (w.timer >= aimMax) { sfx('shoot'); let aSpd = 12 * (1 + getMeta('arr_spd') * 0.2); arrows.push({ active:true, x:w.x, y:w.y, angle:w.bowAngle, speed:aSpd, target:w.targetObj, owner: w, isHunter: true }); w.state = 'waiting_arrow'; w.timer = 0; }
            }
            else if (w.state === 'waiting_arrow') { w.timer++; if (!w.targetObj || !w.targetObj.active || w.timer > 60) { w.state = 'idle'; w.timer = 0; } }
            else if (w.state === 'looting') { w.targetObj.active = false; if(w.targetObj.isGoldDrop) globalGold++; else w.carryFood++; sfx('pickup'); w.state = 'idle'; }
            
            else if (w.state === 'returning') {
                if (w.path.length === 0) w.path = calculatePath(w.x, w.y, camp.x, camp.y); walkPath(w);
                if (w.path.length === 0) {
                    if (camp.type!=='food' && w.carryFood > 0) { globalFood += w.carryFood; w.carryFood = 0; sfx('depositF'); }
                    let pC = camp.type!=='food' ? w.carry : w.carryFood;
                    let dblChance = camp.type==='wood' ? getMeta('dbl_w')*0.05 : (camp.type==='food' ? getMeta('dbl_f')*0.05 : (camp.type==='gold'?getMeta('dbl_g')*0.05 : getMeta('dbl_s')*0.05));
                    if (Math.random() < dblChance) pC *= 2;

                    let dep = Math.min(pC, camp.capacity - camp.stored);
                    if (dep > 0) { 
                        camp.stored += dep; 
                        if (camp.type==='wood') { globalWood += dep; w.carry = 0; sfx('depositW'); }
                        else if (camp.type==='stone') { globalStone += dep; w.carry = 0; sfx('depositS'); }
                        else if (camp.type==='gold') { globalGold += dep; w.carry = 0; sfx('depositS'); }
                        else { globalFood += dep; w.carryFood = 0; sfx('depositF'); }
                    } updateUI(); w.state = camp.stored >= camp.capacity ? 'idle_full' : 'idle';
                }
            }
        }

        // Lógica Exclusiva da Torre
        function processTower(c) {
            let w = c.worker;
            let tEnemy = getClosestEnemy(w.x, w.y);
            if (tEnemy) {
                let dx = tEnemy.x - w.x, dy = tEnemy.y - w.y, d = Math.sqrt(dx*dx + dy*dy); let atkRange = 300 * (1 + getMeta('atk_w')*0.1);
                if (d <= atkRange) {
                    w.bowAngle = Math.atan2(dy, dx); w.timer++; w.state = 'aiming'; let aimMax = 25 * Math.pow(0.85, getMeta('act_f')) * Math.pow(0.85, getMeta('tw_spd'));
                    if (w.timer >= aimMax) {
                        sfx('shoot'); let aSpd = 15 * (1 + getMeta('arr_spd') * 0.2);
                        arrows.push({ active:true, x:w.x, y:w.y, angle:w.bowAngle, speed:aSpd, target:tEnemy, owner: w, isTower: true });
                        w.timer = 0; w.state = 'guarding';
                    }
                } else { w.state = 'guarding'; w.timer = 0; }
            } else { w.state = 'guarding'; w.timer = 0; }
        }

        function startGame() {
            document.getElementById('start-overlay').style.display = 'none'; initAudio(); loadMeta();
            if (!loadGame()) { 
                createCamp('wood'); globalWood = getMeta('str_w') * 50; globalFood = getMeta('str_f') * 50; globalStone = getMeta('str_s') * 25; globalGold = getMeta('str_g') * 10;
                if(getMeta('free_c') > 0) { for(let i=0; i<getMeta('free_c'); i++) createCamp('food'); }
                if(getMeta('free_w') > 0) { for(let i=0; i<getMeta('free_w'); i++) createCamp('barracks'); }
            } setInterval(saveGame, 5000); updateUI(); gameLoop();
        }

        let tickCounter = 0;
        function gameLoop() {
            if (isGameOver) return; ctx.clearRect(0, 0, canvas.width, canvas.height);
            tickCounter++; if(tickCounter >= 60) { totalPlaySeconds++; tickCounter = 0; }
            
            const vP = 200, zl = camera.zoom;
            const vL = camera.x - (canvas.width/2)/zl - vP, vR = camera.x + (canvas.width/2)/zl + vP;
            const vT = camera.y - (canvas.height/2)/zl - vP, vB = camera.y + (canvas.height/2)/zl + vP;
            const isVis = (ox, oy) => (ox > vL && ox < vR && oy > vT && oy < vB);

            let aliveCamps = 0, aliveHunters = 0;
            for(let i=0; i<camps.length; i++) { 
                if (camps[i].type === 'barracks') { if (camps[i].warriors.some(w => !w.isDead)) aliveCamps++; }
                else if (camps[i].type !== 'tower' && !camps[i].worker.isDead) { aliveCamps++; if(camps[i].type==='food') aliveHunters++; } 
            }

            if (tickCounter === 0 && getMeta('cp_rep') > 0) { camps.forEach(c => { if(c.hp < c.maxHp) c.hp = Math.min(c.maxHp, c.hp + 2); }); walls.forEach(w => w.segments.forEach(s => { if(s.hp < s.maxHp) s.hp = Math.min(s.maxHp, s.hp + 2); })); }
            if (tickCounter === 0) { if(totalPlaySeconds % 10 === 0) { globalWood += getMeta('pas_w'); globalFood += getMeta('pas_f'); } if(totalPlaySeconds % 20 === 0) globalStone += getMeta('pas_s'); if(totalPlaySeconds % 30 === 0) globalGold += getMeta('pas_g'); updateUI(); }

            maintainWorld(aliveCamps); processEnemies(aliveHunters);
            
            for(let i=0; i<camps.length; i++) {
                if (camps[i].type === 'tower') processTower(camps[i]);
                else if (camps[i].type === 'barracks') { camps[i].warriors.forEach(w => processWarrior(w, camps[i])); }
                else processWorker(camps[i]);
            }
            
            resolveCollisions(); 

            for(let i=0; i<hares.length; i++) { let h=hares[i]; if(h.active){ if(Math.random()<0.02 + (getMeta('spn_hr') * 0.005)){ h.x+=(Math.random()-0.5)*15; h.y+=(Math.random()-0.5)*15;} } else { h.timer--; if(h.timer<=0){ let pt = getValidSpawnPoint(camera.x, camera.y, 1500); if (pt.valid) { h.active=true; h.x=pt.x; h.y=pt.y; } else { h.timer = 10; } } } }
            for(let i=0; i<trees.length; i++) { let t=trees[i]; if(!t.active){ t.timer--; if(t.timer<=0){ let pt = getValidSpawnPoint(camera.x, camera.y, 1500); if (pt.valid) { t.active=true; t.hits=Math.max(1, 3 - getMeta('yld_w')); t.maxH=t.hits; t.x=pt.x; t.y=pt.y; } else { t.timer = 10; } } } }
            for(let i=0; i<mountains.length; i++) { let m=mountains[i]; if(!m.active){ m.timer--; if(m.timer<=0){ let mx = camera.x+(Math.random()>0.5?1:-1)*(800+Math.random()*600); let my = camera.y+(Math.random()>0.5?1:-1)*(800+Math.random()*600); if (!isPointInWall(mx, my)) { m.active=true; m.hits=50; m.x=mx; m.y=my; bears.length=0; bears.push({ x:m.x+50, y:m.y+50, active:true, speed:1.5 * Math.pow(0.95, getMeta('spd_br')), type: 'bear', spawnX:m.x, spawnY:m.y, path: [] }); } else { m.timer = 10; } } } }
            for(let i=0; i<goldMountains.length; i++) { let m=goldMountains[i]; if(!m.active){ m.timer--; if(m.timer<=0){ let mx = camera.x+(Math.random()>0.5?1:-1)*(1000+Math.random()*800); let my = camera.y+(Math.random()>0.5?1:-1)*(1000+Math.random()*800); if (!isPointInWall(mx, my)) { m.active=true; m.hits=50; m.x=mx; m.y=my; lions.length=0; lions.push({ x:m.x+50, y:m.y+50, active:true, speed:2.0, type: 'lion', spawnX:m.x, spawnY:m.y, path: [] }); } else { m.timer = 10; } } } }

            if (camps.length > 0 && aliveCamps === 0) { triggerRoguelikeDeath(); return; }
            camps = camps.filter(c => { if(c.hp <= 0) { if(c.worker) c.worker.isDead = true; if(c.warriors) c.warriors.forEach(w=>w.isDead=true); return false; } return true; });

            for(let i=arrows.length-1; i>=0; i--) {
                let a = arrows[i];
                if(a.active) {
                    if (a.target && a.target.active) a.angle = Math.atan2(a.target.y - a.y, a.target.x - a.x);
                    a.x += Math.cos(a.angle) * a.speed; a.y += Math.sin(a.angle) * a.speed;
                    let isPred = a.target && (a.target.type==='wolf'||a.target.type==='bear'||a.target.type==='lion'||a.target.type==='enemyWarrior');
                    if(a.target && a.target.active && (a.x-a.target.x)*(a.x-a.target.x) + (a.y-a.target.y)*(a.y-a.target.y) < (isPred?625:225)) {
                        a.active = false;
                        let extraLethal = a.isTower ? (getMeta('tw_dmg')*0.05) : (getMeta('hnt_war')*0.05);
                        
                        if (a.target.type==='wolf') { if (Math.random() <= 0.8) { a.target.active = false; sfx('wolf_die'); drops.push({ x: a.target.x, y: a.target.y, active: true, isDrop: true }); } } 
                        else if (a.target.type==='bear') { if (Math.random() <= 0.35) { a.target.active = false; sfx('bear_roar'); drops.push({ x: a.target.x, y: a.target.y, active: true, isDrop: true }, { x: a.target.x+10, y: a.target.y+10, active: true, isDrop: true }); } } 
                        else if (a.target.type==='lion') { if (Math.random() <= 0.25) { a.target.active = false; sfx('bear_roar'); drops.push({ x: a.target.x, y: a.target.y, active: true, isDrop: true }); if(Math.random()<=0.1+getMeta('drp_lio')*0.1) drops.push({x:a.target.x-10,y:a.target.y,active:true,isGoldDrop:true}); } } 
                        else if (a.target.type==='enemyWarrior') { if (Math.random() <= 0.5 + extraLethal) { a.target.active = false; sfx('human_die'); if(Math.random() <= getMeta('emy_drp')*0.15) drops.push({x:a.target.x,y:a.target.y,active:true,isGoldDrop:true}); } }
                        else { a.target.active = false; a.target.timer = 150; let hF = getMeta('hare_f')>0 ? 2:1; for(let h=0; h<hF; h++) drops.push({ x: a.target.x+(h*5), y: a.target.y, active: true, isDrop: true }); }
                        for(let c=0; c<camps.length; c++) { if(camps[c].worker && camps[c].worker.targetObj === a.target && (camps[c].worker.state === 'waiting_arrow' || camps[c].type === 'tower')) camps[c].worker.state = camps[c].type === 'tower' ? 'guarding' : 'idle'; }
                    }
                    if((a.x-camera.x)*(a.x-camera.x) + (a.y-camera.y)*(a.y-camera.y) > 4000000) a.active = false;
                } else arrows.splice(i, 1);
            }

            for(let i=wolves.length-1; i>=0; i--) if(!wolves[i].active) wolves.splice(i, 1);
            for(let i=bears.length-1; i>=0; i--) if(!bears[i].active) bears.splice(i, 1);
            for(let i=lions.length-1; i>=0; i--) if(!lions[i].active) lions.splice(i, 1);
            for(let i=enemyWarriors.length-1; i>=0; i--) if(!enemyWarriors[i].active) enemyWarriors.splice(i, 1);
            for(let i=drops.length-1; i>=0; i--) if(!drops[i].active) drops.splice(i, 1);

            ctx.save(); ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(zl, zl); ctx.translate(-camera.x, -camera.y);

            for(let i=0; i<walls.length; i++) {
                let w = walls[i];
                for(let j=0; j<w.segments.length; j++) {
                    let s = w.segments[j];
                    if (isVis(s.x, s.y)) { 
                        ctx.fillStyle = "#374151"; ctx.fillRect(s.x - 12, s.y - 12, 24, 24); ctx.fillStyle = "#9ca3af"; ctx.fillRect(s.x - 6, s.y - 6, 12, 12); ctx.fillStyle = "#1f2937"; ctx.fillRect(s.x - 12, s.y + 8, 24, 4); 
                        if(s.hp < s.maxHp) { ctx.fillStyle = "red"; ctx.fillRect(s.x-10, s.y+15, 20, 3); ctx.fillStyle = "#4ade80"; ctx.fillRect(s.x-10, s.y+15, 20*(s.hp/s.maxHp), 3); }
                    }
                }
            }

            for(let i=0; i<drops.length; i++) if (isVis(drops[i].x, drops[i].y)) drawEmoji(drops[i].isGoldDrop?"🪙":"🍖", 20, drops[i].x, drops[i].y);
            for(let i=0; i<hares.length; i++) if (hares[i].active && isVis(hares[i].x, hares[i].y)) drawEmoji("🐇", 20, hares[i].x, hares[i].y);

            for(let i=0; i<trees.length; i++) { let t=trees[i]; if (isVis(t.x, t.y)) { if(t.active) { drawEmoji("🌲", 35, t.x, t.y); if(t.hits<t.maxH){ ctx.fillStyle="#1a3b22"; ctx.fillRect(t.x-15,t.y-25,30,4); ctx.fillStyle="#fbbf24"; ctx.fillRect(t.x-15,t.y-25,30*(t.hits/t.maxH),4); } } else drawEmoji("🪵", 25, t.x, t.y+10); } }
            for(let i=0; i<mountains.length; i++) { let m=mountains[i]; if (isVis(m.x, m.y)) { if(m.active) { drawEmoji("⛰️", 50, m.x, m.y); if(m.hits<50){ ctx.fillStyle="#1a3b22"; ctx.fillRect(m.x-20,m.y-35,40,5); ctx.fillStyle="#9ca3af"; ctx.fillRect(m.x-20,m.y-35,40*(m.hits/50),5); } } else drawEmoji("🪨", 30, m.x, m.y+10); } }
            for(let i=0; i<goldMountains.length; i++) { let m=goldMountains[i]; if (isVis(m.x, m.y)) { if(m.active) { drawEmoji("🗻", 50, m.x, m.y); if(m.hits<50){ ctx.fillStyle="#b45309"; ctx.fillRect(m.x-20,m.y-35,40,5); ctx.fillStyle="#fde047"; ctx.fillRect(m.x-20,m.y-35,40*(m.hits/50),5); } } else drawEmoji("🪙", 30, m.x, m.y+10); } }

            for(let i=0; i<camps.length; i++) {
                let c = camps[i];
                if (isVis(c.x, c.y)) {
                    drawEmoji(c.icon, c.type==='tower'?50:40, c.x, c.y);
                    if (c.hp < c.maxHp) { ctx.fillStyle = "red"; ctx.fillRect(c.x-20, c.y-30, 40, 5); ctx.fillStyle = "#4ade80"; ctx.fillRect(c.x-20, c.y-30, 40*(c.hp/c.maxHp), 5); }
                }
            }
            
            for(let i=0; i<bears.length; i++) if(bears[i].active && isVis(bears[i].x, bears[i].y)) drawEmoji("🐻", 40, bears[i].x, bears[i].y);
            for(let i=0; i<lions.length; i++) if(lions[i].active && isVis(lions[i].x, lions[i].y)) drawEmoji("🦁", 40, lions[i].x, lions[i].y);
            for(let i=0; i<wolves.length; i++) if(wolves[i].active && isVis(wolves[i].x, wolves[i].y)) drawEmoji("🐺", 25, wolves[i].x, wolves[i].y);
            
            for(let i=0; i<enemyWarriors.length; i++) if(enemyWarriors[i].active && isVis(enemyWarriors[i].x, enemyWarriors[i].y)) { 
                ctx.fillStyle = "#dc2626"; ctx.beginPath(); ctx.arc(enemyWarriors[i].x, enemyWarriors[i].y, 14, 0, Math.PI*2); ctx.fill(); drawEmoji("🪖", 28, enemyWarriors[i].x, enemyWarriors[i].y); 
                let clubAngle = enemyWarriors[i].state==='hitting_wall' ? (enemyWarriors[i].timer%20>10?-Math.PI/4:0) : 0;
                drawEmojiRotated("🏏", 18, enemyWarriors[i].x+12, enemyWarriors[i].y-2, clubAngle); 
            }

            ctx.strokeStyle = "white"; ctx.lineWidth = 2;
            for(let i=0; i<arrows.length; i++) { let a = arrows[i]; if(a.active && isVis(a.x, a.y)) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x - Math.cos(a.angle)*15, a.y - Math.sin(a.angle)*15); ctx.stroke(); } }

            for(let i=0; i<camps.length; i++) {
                if (camps[i].type === 'barracks') {
                    camps[i].warriors.forEach(w => {
                        if (w.isDead || !isVis(w.x, w.y)) return;
                        ctx.fillStyle = "#2563eb"; ctx.beginPath(); ctx.arc(w.x, w.y, 12, 0, Math.PI*2); ctx.fill();
                        drawEmoji(w.icon, 25, w.x, w.y);
                        let clubAngle = w.showAct ? -Math.PI/4 : 0;
                        drawEmojiRotated("🏏", 18, w.x+10, w.y+2, clubAngle); 
                    });
                } 
                else if (camps[i].type !== 'tower') {
                    let w = camps[i].worker;
                    if (w.isDead || !isVis(w.x, w.y)) continue;
                    drawEmoji(w.icon, 25, w.x, w.y);
                    if(w.state === 'idle_full') drawEmoji("💤", 15, w.x + 12, w.y - 12);
                    else if(w.carry + w.carryFood >= w.maxCarry) drawEmoji("📦", 15, w.x + 12, w.y - 12);
                    if(w.showAct) drawEmoji((camps[i].type==='stone'||camps[i].type==='gold') ? "⛏️" : "🪓", 20, w.x+15, w.y-10);
                    if(w.state==='aiming' || w.state==='hunting') drawEmojiRotated("🏹", 18, w.x+15, w.y, w.bowAngle + Math.PI/4);
                }
            }

            ctx.font = "bold 15px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            for(let i=0; i<camps.length; i++) {
                let c = camps[i];
                if (c.type === 'tower') continue; 
                if (isVis(c.x, c.y)) {
                    let discCost = Math.max(1, Math.floor(c.upgCostW * Math.pow(0.95, getMeta('upg_disc'))));
                    if(c.type !== 'barracks') {
                        let tC = `${c.stored}/${c.capacity}`; let cW = tC.length * 8.5 + 8;
                        ctx.fillStyle = "rgba(0, 0, 0, 0.65)"; ctx.fillRect(c.x - cW/2, c.y + 24, cW, 20);
                        ctx.fillStyle = c.stored >= c.capacity ? "#ef4444" : "#ffffff"; ctx.fillText(tC, c.x, c.y + 34);
                    }
                    let cT = `${discCost}🪵`; let uW = cT.length * 9.5 + 8;
                    ctx.fillStyle = "rgba(0, 0, 0, 0.65)"; ctx.fillRect(c.x - uW/2, c.y - 44, uW, 20);
                    ctx.fillStyle = globalWood >= discCost ? "#4ade80" : "#6b7280"; ctx.fillText(cT, c.x, c.y - 34);
                }
            } ctx.restore(); requestAnimationFrame(gameLoop);
        }
    </script>
</body>
